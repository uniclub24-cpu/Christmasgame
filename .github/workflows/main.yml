
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Find project folder
        id: proj
        run: |
          F=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle.kts 파일이 없습니다. zip 안의 파일이 모두 올라갔는지 확인하세요."
            find . -maxdepth 3 -not -path "./.git*" | head -100
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Peli-xmas-games-apk
          path: '**/app/build/outputs/apk/**/*.apk'
          if-no-files-found: error
